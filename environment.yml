# environment.yml
# Créé automatiquement avec: conda env export -n ewondo-gnn > environment.yml
# Pour créer l'environnement: conda env create -f environment.yml

name: ewondo-gnn
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - cudatoolkit=11.8  # ou 12.1 selon votre système
  - pip:
    - torch>=2.1.0
    - torchaudio>=2.1.0
    - torch-geometric>=2.5.0
    - torch-scatter>=2.1.0
    - torch-sparse>=0.6.17
    - torch-cluster>=1.6.1
    - torch-spline-conv>=1.2.3
    - transformers>=4.40.0
    - sentence-transformers>=2.2.0
    - librosa>=0.10.0
    - soundfile>=0.12.0
    - soxr>=0.3.0
    - networkx>=3.2
    - netbone>=0.1.0
    - scipy>=1.12.0
    - panphon>=0.20.0
    - g2p-en>=2.1.0
    - numpy>=1.26.0
    - pandas>=2.2.0
    - scikit-learn>=1.4.0
    - matplotlib>=3.8.0
    - seaborn>=0.13.0
    - pyyaml>=6.0
    - tqdm>=4.66.0
    - click>=8.1.0
    - colorama>=0.4.6
    - wandb>=0.16.0
    - tensorboard>=2.16.0
    - black>=24.0.0
    - pylint>=3.0.0
    - pytest>=8.0.0
    - pre-commit>=3.6.0
